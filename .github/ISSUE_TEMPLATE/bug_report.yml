name: Something is wrong
description: A wrong reading, a missing device, an error in the log, or a write that did not take.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Name the entity or device. For a wrong reading, say what the Sungrow app or the inverter's screen shows at the same moment.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Logger model and firmware; each inverter's model; battery towers (model and how many); meter model. Is anything else (another integration, a Modbus YAML package, a VPP) reading the Logger too?
      placeholder: "Logger1000A, firmware ...; SH10T; 2 × SBR128; DTSU666"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Sungrow Alive 0.1.1, Home Assistant 2026.11.0"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Sungrow Alive → ⋮ → Download diagnostics, then drag the file here. Serial numbers and the Logger's address are removed from it.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: Settings → System → Logs, filtered on `sungrow_sh_t`. Paste the lines around the problem.
      render: text
