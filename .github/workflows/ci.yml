name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest==8.3.3 ruff==0.8.4
      - name: "Lint (real mistakes only: syntax, undefined or unused names)"
        run: ruff check --select E9,F custom_components tests tools
      - name: The invented site is what make_synthetic.py writes
        run: python tools/make_synthetic.py && git diff --exit-code data/synthetic
      - name: Tests (no Home Assistant needed)
        run: pytest -q tests
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
